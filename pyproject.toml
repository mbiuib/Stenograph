[project]
name = "stenograph"
version = "0.1.0"
description = "Стенограф — local-first meeting transcription: files, live capture and Jitsi, with diarization and LLM post-processing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.1",
    # faster-whisper 1.2.x calls av.open(metadata_errors=...), which av 19 removed.
    "av>=14,<19",
    "nvidia-cublas-cu12>=12.4; sys_platform == 'win32'",
    "nvidia-cuda-runtime-cu12>=12.4; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
stenograph = "stenograph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stenograph"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D"]
ignore = ["D203", "D213", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Form", "fastapi.Depends", "fastapi.Query", "fastapi.File"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "ctranslate2.*", "av.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
